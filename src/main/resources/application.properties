spring.application.name=StudentHubApplication_Backend

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/StudentHubDatabase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect (removed, as auto-detection is preferred)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.address=0.0.0.0

# CORS - Allow multiple origins for testing
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT
jwt.secret=your-secure-secret-key-1234567890
jwt.expiration=86400000